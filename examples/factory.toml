schema_version = 1

repositories = ["yeutterg/dark-factory"]

skills = [
  "@archive-before-delete",
  "@redesign",
]

date_exceptions = []

[project]
id = "dark-factory"
name = "dark-factory"
state_dir = "./state"

[labels]
selected = "factory"
iteration = "sprint"

[geography_policy]
blocked_regions = ["CN", "CHINA", "PRC"]

[budgets]
root_cents = 2000

[runtime]
operator_token = "bootstrap-operator-dev-token-0123456789"
api_host = "127.0.0.1"
api_port = 8745
default_timeout_seconds = 3600
max_output_bytes = 2000000

[[windows]]
days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
start = "00:00"
end = "23:59"
timezone = "America/Los_Angeles"

[role_routes]
planner = "fake-coder"
critic = "fake-coder"
coder = "fake-coder"
reviewer = "fake-coder"

[environments.local]
kind = "native" # Fake-only fixture; never admits a real CLI without isolation.

[routes.fake-coder]
project_id = "dark-factory"
account_kind = "simulation"
environment = "local"
model = "fake-local"
harness = "fake"
harness_version = "0.1"
provider = "none"
endpoint = "local"
billing_account = "local"
region = "US"
role = "coder"
max_cents = 500

[commands.tracking]
argv = ["dark-factory", "adapter", "github-tracking"]
timeout_seconds = 30

[commands.code_host]
argv = ["dark-factory", "adapter", "github-codehost"]
timeout_seconds = 30

[prompts]
# omit roles to use packaged defaults
