# Installed on the worker, not the supervisor. No factory.toml or operator token needed.
url = "http://127.0.0.1:8745" # Use HTTPS on another host, or an explicit authenticated tunnel.
project_id = "example-project"
worker_id = "worker1"
token_env = "EXAMPLE_PROJECT_WORKER1_TOKEN"
state_dir = "./state/example-worker"
