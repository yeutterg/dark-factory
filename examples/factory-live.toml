# Template only: no live route is approved or enabled by this file.
schema_version = 1
repositories = ["owner/repository"]
skills = ["@archive-before-delete", "@redesign"]

[project]
name = "my-project"
state_dir = "./isolated-factory-state"

[geography_policy]
blocked_regions = ["CN", "CHINA", "PRC"]

[budgets]
root_cents = 1000
planning_cents = 100
account_cents = 1000

[runtime]
worker_token_env = "FACTORY_WORKER_TOKEN"
operator_token_env = "FACTORY_OPERATOR_TOKEN"
api_host = "127.0.0.1"
api_port = 8745
max_output_bytes = 2000000

[execution]
profile = "macos-sandbox"
pi_binary = "/opt/homebrew/bin/pi"
max_seconds = 7200

[routes.primary]
model = "deepseek-ai/DeepSeek-V4.1-Flash"
harness = "pi"
evidence_kind = "live"
harness_version = "1.4.0"
provider = "together"
endpoint = "https://api.together.ai/v1"
billing_account = "REPLACE_WITH_APPROVED_ACCOUNT_REFERENCE"
region = "US"
geography_evidence = "https://docs.together.ai/docs/privacy-and-security — DeepSeek on Together is hosted in Together North America data centers."
auth_env = "TOGETHER_API_KEY"
api = "openai-completions"
# Example published rates, not an account/invoice spending guarantee. Verify at approval time.
pricing = { input = 0.30, output = 1.20, cache_read = 0.006, cache_write = 0.0 }
pricing_evidence = "https://www.together.ai/models/deepseek-v4-1-flash"
role = "coder"
reasoning = true
context_window = 1000000
max_tokens = 8192
max_cents = 200

[sources."owner/repository"]
path = "/absolute/path/to/source-checkout"
revision = "REPLACE_WITH_BASE_COMMIT"
require_live_evidence = true
checks = ["verify"]
allowed_paths = ["src"]
protected_paths = ["tests", "pyproject.toml", "AGENTS.md"]
manual_acceptance = ["Inspect candidate diff", "Confirm authorized human merge"]
# Optional: PR checks, statuses or reviewer logins that must pass on the candidate.
# external_acceptance = ["Cursor Bugbot", "devin-ai-integration[bot]"]

[commands.verify]
argv = ["/opt/homebrew/bin/python3.12", "-m", "unittest", "discover", "-s", "tests"]
timeout_seconds = 300

# Optional: resume a step automatically after a transient interruption (default 1).
# [continuation]
# max_resumes = 1

# Optional decision agent for interruptions; see docs/usage.md#decision-agents.
# [decider]
# region = "US"
# min_confidence = 0.8
# [commands.decider]
# argv = ["dark-factory", "adapter", "jev-decision"]
# timeout_seconds = 30

[commands.tracking]
# Add "--project", "owner/number" to also list open issues from a GitHub Project.
argv = ["dark-factory", "adapter", "github-tracking"]
timeout_seconds = 60

[commands.code_host]
argv = ["dark-factory", "adapter", "github-codehost"]
timeout_seconds = 60
