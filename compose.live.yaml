services:
  server:
    build:
      args:
        LOCKFILE: requirements-dev.lock
    environment:
      GH_TOKEN: ${DARK_FACTORY_GITHUB_TOKEN:-}
    volumes:
      - ./factory.local.toml:/config/factory.toml:ro
      # Only the repository metadata: a revision is pinned and cloned from it, and the
      # working tree (with .env and local profiles) is never mounted.
      - ./.git:/source/.git:ro
      - live-supervisor-state:/state

  worker:
    build:
      args:
        LOCKFILE: requirements-dev.lock
    # Matches environments.container-bwrap in examples/compose/factory-live.toml.
    mem_limit: 4g
    pids_limit: 512
    cpus: 2.0
    user: "0:0"
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SETUID
      - SETGID
      - SETFCAP
    security_opt:
      - seccomp=unconfined
    environment:
      COMPOSE_WORKER_TOKEN: ${COMPOSE_WORKER_TOKEN:?Run ./scripts/compose-init}
      DARK_FACTORY_LIVE_CODEX_AUTH_JSON: ${DARK_FACTORY_LIVE_CODEX_AUTH_JSON:-}
      DARK_FACTORY_LIVE_TOGETHER_API_KEY: ${DARK_FACTORY_LIVE_TOGETHER_API_KEY:-}
    volumes:
      - ./execution-worker.local.toml:/config/execution-worker.toml:ro
      - live-worker-state:/state

volumes:
  live-supervisor-state:
  live-worker-state:
