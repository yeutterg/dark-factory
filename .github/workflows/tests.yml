name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: pip install '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: npm ci --ignore-scripts && npm run check
        working-directory: src/dark_factory/adapters/workflow/pi_engine
      - run: python -m pytest -q -n auto
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/compose-init
      - run: docker compose config --quiet
      - run: docker compose build server
      - run: docker compose up --detach server worker
      - run: ./scripts/compose-smoke
      - if: always()
        run: docker compose down --volumes
