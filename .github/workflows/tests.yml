name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install '.[dev]'
      - run: npm ci --ignore-scripts && npm run check
        working-directory: src/dark_factory/adapters/workflow/pi_engine
      - run: python -m pytest -q
