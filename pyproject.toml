[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-factory"
version = "0.1.0"
description = "Plan, approve, execute, and review coding work with a controller and workers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Greg Yeutter" }]
license = "MIT"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
tui = ["textual>=8.2,<9"]
dev = ["textual>=8.2,<9", "pytest>=9.1", "pytest-xdist==3.8.0", "ruff==0.17.6", "mypy==2.4.1", "jsonschema>=4.23"]

[project.scripts]
dark-factory = "dark_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dark_factory = [
  "agents/prompts/*.md",
  "agents/skills/*/SKILL.md",
  "ui/*.tcss",
  "ui/static/*.html",
  "ui/static/*.css",
  "ui/static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["decider(answer): configure a scripted decision agent before planning"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/dark_factory"]
ignore_missing_imports = true
warn_unused_ignores = true

