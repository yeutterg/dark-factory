[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-factory"
version = "0.1.0"
description = "Plan, approve, execute, and review coding work with a controller and workers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Greg Yeutter" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dark-factory = "dark_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dark_factory = [
  "agents/prompts/*.md",
  "agents/skills/*/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
