[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-factory"
version = "0.1.0"
description = "Plan, approve, execute, and review coding work with a controller and workers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Greg Yeutter" }]
license = { text = "MIT" }
dependencies = ["textual>=8.2,<9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist==3.8.0", "ruff==0.17.0", "mypy==2.4.0"]

[project.scripts]
dark-factory = "dark_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dark_factory = [
  "agents/prompts/*.md",
  "agents/skills/*/SKILL.md",
  "adapters/workflow/pi_engine/*.ts",
  "adapters/workflow/pi_engine/package*.json",
  "ui/*.tcss",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/dark_factory"]
ignore_missing_imports = true
warn_unused_ignores = true

